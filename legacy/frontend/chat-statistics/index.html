    <link rel="stylesheet" href="src/styles/effects/glass-liquid.css">

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    
</head>

<body class="with-navbar">
    <!-- ============================================================================
         NAVBAR
         ============================================================================ -->
    <header class="navbar">
        <div class="navbar__inner">
            <a class="navbar__logo" href="/">
                TWINKY
            </a>

            <nav class="navbar__links" aria-label="Primary">
                <a href="#chat" aria-current="page">Chat</a>
                <a href="#agent">Agent</a>
                <a href="#pricing">Pricing</a>
                <a href="#friends">Friends</a>
            </nav>

            <div class="navbar__actions">
                <button class="support-btn" type="button">Support</button>
                <button class="profile-btn" type="button" aria-label="Profile"></button>
            </div>
        </div>
    </header>

    <!-- ============================================================================
         MAIN CONTENT
         ============================================================================ -->
    <div class="app-container">
        <main class="main-content">
            <!-- Status Section -->
            <section class="status-section">
                <div class="glass">
                    <div class="glass-body status-body">
                        <div class="status-row">
                            <!-- Blob (inline mode) -->
                            <div id="blob" class="blob--inline">
                                <div class="blob-scale">
                                    <spline-viewer class="spline-hero"
                                        url="https://prod.spline.design/yCKXQB80GKuupGvZ/scene.splinecode">
                                    </spline-viewer>
                                </div>
                            </div>

                            <!-- Info Column -->
                            <div class="status-info">
                                <h2 class="status-title" id="streamer-name">KAMIL <3 UMKA</h2>
                                <div class="status-meta">
                                    <div class="viewers" aria-live="polite">
                                        <span class="dot" aria-hidden="true"></span>
                                        <span id="viewer-count">55,555</span>
                                    </div>

                                    <div class="running" role="status">
                                        <span class="dot" aria-hidden="true"></span>
                                        <span class="running-label">STREAM IS RUNNING</span>
                                        <span class="running-dots" data-running-dots aria-hidden="true">
                                            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Timer -->
                        <div class="status-timer" id="stream-timer">00:00:00</div>
                    </div>
                </div>
            </section>

            <!-- Chart Section -->
            <section class="chat-summary-section">
                <div id="chat-summary-root"></div>
            </section>

            <section class="chart-section">
                <div class="glass">
                    <div class="glass-body chart-card-body">
                        <header class="chart-meta">
                        <div>
                                <h3 class="chart-meta__title">Chat Cluster Heatmap</h3>
                            </div>
                        </header>
                        <div class="chart-container">
                            <div id="bar-chart"></div>
                        </div>
                    </div>
                </div>
                <div id="chat-statistics-root"></div>
            </section>

            <!-- Right Chat Dock -->
            <aside class="chat-dock">
                <div class="glass chat-card">
                    <div class="glass-body chat-body">
                        <header class="chat-header">
                            <span class="chat-title">Stream Chat</span>
                            <button id="chat-new" class="chat-new" hidden aria-label="New messages">
                                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 5v10m0 0l-5-5m5 5l5-5" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                        </header>
                        <ul id="chat-list" class="chat-list" aria-live="polite"></ul>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- ============================================================================
         SCRIPTS
         ============================================================================ -->

    <!-- Spline Interaction Handler -->
    <script>
        (function () {
            const overSpline = (e) =>
                e.composedPath && e.composedPath().some(
                    n => n && n.tagName && n.tagName.toLowerCase() === 'spline-viewer'
                );

            // Kill wheel zoom over the viewer (keep page scroll elsewhere)
            window.addEventListener('wheel', (e) => {
                if (overSpline(e)) {
                    e.stopImmediatePropagation();
                    e.stopPropagation();
                }
            }, { capture: true, passive: true });

            // Kill pinch/gesture zoom on mobile/Safari over the viewer
            const stopPinch = (e) => {
                if (!overSpline(e)) return;
                const multiTouch = e.touches && e.touches.length > 1;
                const hasScale = typeof e.scale !== 'undefined';
                if (multiTouch || hasScale) {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    e.stopPropagation();
                }
            };
            window.addEventListener('touchmove', stopPinch, { capture: true, passive: false });
            window.addEventListener('gesturestart', stopPinch, { capture: true, passive: false });
            window.addEventListener('gesturechange', stopPinch, { capture: true, passive: false });
            window.addEventListener('gestureend', stopPinch, { capture: true, passive: false });

            // Kill MIDDLE-MOUSE panning / autoscroll over the viewer
            const isMiddle = (e) => (e.button === 1) || ((e.buttons | 0) & 4) || (e.which === 2);

            const killMiddleDown = (e) => {
                if (overSpline(e) && isMiddle(e)) {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    e.stopPropagation();
                }
            };
            const killMiddleMove = (e) => {
                if (overSpline(e) && ((e.buttons | 0) & 4)) {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    e.stopPropagation();
                }
            };

            window.addEventListener('pointerdown', killMiddleDown, { capture: true, passive: false });
            window.addEventListener('pointermove', killMiddleMove, { capture: true, passive: false });
            window.addEventListener('mousedown', killMiddleDown, { capture: true, passive: false });
            window.addEventListener('mousemove', killMiddleMove, { capture: true, passive: false });

            // Stop auxclick for middle button
            window.addEventListener('auxclick', (e) => {
                if (overSpline(e)) {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    e.stopPropagation();
                }
            }, { capture: true, passive: false });
        })();
    </script>

    <!-- Stream Timer -->
    <script>
        (() => {
            const el = document.getElementById('stream-timer');
            if (!el) return;
            const start = Date.now();
            const pad = n => String(n).padStart(2, '0');
            const tick = () => {
                const s = Math.floor((Date.now() - start) / 1000);
                const h = Math.floor(s / 3600);
                const m = Math.floor((s % 3600) / 60);
                const sec = s % 60;
                el.textContent = `${pad(h)}:${pad(m)}:${pad(sec)}`;
            };
            tick();
            setInterval(tick, 1000);
        })();
    </script>

    <!-- Stream Meta Widgets -->
    <script>
        (() => {
            const viewerEl = document.getElementById('viewer-count');
            if (!viewerEl) return;

            const fmt = new Intl.NumberFormat('en-US');
            let viewers = 55555;

            const updateViewers = () => {
                viewers = Math.max(1200, viewers + Math.floor((Math.random() - 0.5) * 1800));
                viewerEl.textContent = fmt.format(viewers);
            };

            updateViewers();
            setInterval(updateViewers, 4500);
        })();
    </script>

    <!-- Spline Viewer Cleanup -->
    <script>
        (() => {
            // Remove any <spline-viewer> not inside #blob
            const purge = () => {
                document.querySelectorAll('spline-viewer').forEach(el => {
                    if (!el.closest('#blob') && !el.closest('.nav-blob')) el.remove();
                });
            };
            purge();

            // Kill any viewers injected later
            new MutationObserver((muts) => {
                for (const m of muts) {
                    for (const n of m.addedNodes) {
                        if (
                            n &&
                            n.tagName &&
                            n.tagName.toLowerCase() === 'spline-viewer' &&
                            !n.closest('#blob') &&
                            !n.closest('.nav-blob')
                        ) {
                            n.remove();
                        }
                    }
                }
            }).observe(document.documentElement, { childList: true, subtree: true });

            console.log('Spline viewers on page:', document.querySelectorAll('spline-viewer').length);
        })();
    </script>

    <!-- Module Scripts -->
    <script type="module" src="src/app.js"></script>
    <script type="module" src="src/runtime/blob/init-blob-viewer.js" defer></script>
    <script type="module" src="src/runtime/chat/chat-simulator.js"></script>
    <script type="module" src="src/runtime/layout/align-chat-panels.js"></script>

    <!-- ============================================================================
         SVG FILTERS
         ============================================================================ -->
    <svg width="0" height="0" style="position:absolute">
        <filter id="liquid-glass-filter" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="5" result="turbulence" />
            <feComponentTransfer in="turbulence" result="mapped">
                <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
                <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
                <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
            </feComponentTransfer>
            <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
            <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100"
                lighting-color="white" result="specLight">
                <fePointLight x="-200" y="-200" z="300" />
            </feSpecularLighting>
            <feComposite in="specLight" operator="arithmetic" k2="1" k3="1" result="litImage" />
            <feDisplacementMap in="SourceGraphic" in2="softMap" scale="120" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

</body>

</html>
