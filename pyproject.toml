[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is `twinky`; the import package stays `ts`. Renaming the package would touch
# every import and every documented command and buy nothing.
name = "twinky"
version = "0.1.0"
description = "Multimodal Twitch audience-signal prototype with cited hypotheses, replay and bounded live sessions."
requires-python = ">=3.10"

# Runtime dependencies deliberately live in requirements.txt, not here: they are pinned exactly,
# split into replay / live-capture / dev groups, and `make setup` installs that file. Declaring
# them twice is how the two lists drift apart.

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
