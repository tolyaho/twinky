<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 412" width="980" height="412" font-family="Inter, system-ui, sans-serif" role="img" aria-label="How one window becomes a verified or rejected card"><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#d6d3d1"/></marker></defs><rect width="980" height="412" fill="#ffffff"/><rect x="24" y="18" width="14" height="14" rx="3" fill="#fafafa" stroke="#0c0a09"/><text x="46" y="30" font-size="11" fill="#4e4e4e">deterministic — checkable, no model</text><rect x="240" y="18" width="14" height="14" rx="3" fill="none" stroke="#777169" stroke-dasharray="4 3"/><text x="262" y="30" font-size="11" fill="#4e4e4e">the model — two nodes, and only these two</text><text x="612" y="30" font-size="11" fill="#a8a29e">every count is measured: 118 recorded runs</text><rect x="24" y="60" width="170" height="62" rx="10" fill="#fafafa" stroke="#0c0a09" stroke-width="1"/><text x="38" y="85" font-size="13" font-weight="500" fill="#0c0a09">sources</text><text x="38" y="104" font-size="11" fill="#777169">chat · speech · frames</text><line x1="194" y1="91" x2="244" y2="91" stroke="#d6d3d1" stroke-width="1" marker-end="url(#a)"/><rect x="244" y="60" width="170" height="62" rx="10" fill="#fafafa" stroke="#0c0a09" stroke-width="1"/><text x="258" y="85" font-size="13" font-weight="500" fill="#0c0a09">reduce</text><text x="258" y="104" font-size="11" fill="#777169">canonical, counted, ids kept</text><line x1="414" y1="91" x2="464" y2="91" stroke="#d6d3d1" stroke-width="1" marker-end="url(#a)"/><rect x="464" y="48" width="210" height="86" rx="10" fill="none" stroke="#777169" stroke-width="1" stroke-dasharray="4 3"/><text x="478" y="73" font-size="13" font-weight="500" fill="#0c0a09">the model</text><text x="478" y="92" font-size="11" fill="#777169">picks tools or answers · t=0</text><line x1="674" y1="91" x2="724" y2="91" stroke="#d6d3d1" stroke-width="1" marker-end="url(#a)"/><text x="699" y="85" font-size="10" fill="#a8a29e" text-anchor="middle">answer</text><text x="464" y="168" font-size="11" fill="#777169">4 bounded tools · max 4 calls per step, executed and validated by the controller</text><rect x="464" y="180" width="210" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1"/><text x="476" y="197" font-size="11" fill="#4e4e4e">get_chat_window</text><text x="662" y="197" font-size="11" fill="#0c0a09" text-anchor="end">3</text><rect x="464" y="214" width="210" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1"/><text x="476" y="231" font-size="11" fill="#4e4e4e">get_frame_captions</text><text x="662" y="231" font-size="11" fill="#0c0a09" text-anchor="end">2</text><rect x="464" y="248" width="210" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1"/><text x="476" y="265" font-size="11" fill="#4e4e4e">get_transcript_window</text><text x="662" y="265" font-size="11" fill="#0c0a09" text-anchor="end">8</text><rect x="464" y="282" width="210" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1"/><text x="476" y="299" font-size="11" fill="#4e4e4e">group_repeated</text><text x="662" y="299" font-size="11" fill="#0c0a09" text-anchor="end">57</text><line x1="569" y1="134" x2="569" y2="176" stroke="#d6d3d1" stroke-width="1" marker-end="url(#a)"/><text x="700" y="196" font-size="10" fill="#a8a29e">calls, across</text><text x="700" y="210" font-size="10" fill="#a8a29e">59 runs with tools</text><text x="464" y="328" font-size="11" fill="#0c0a09">51 of 59 runs spent 1 of their 4 steps</text><text x="464" y="344" font-size="11" fill="#777169">and the one step was chat</text><rect x="724" y="60" width="232" height="62" rx="10" fill="none" stroke="#777169" stroke-width="1" stroke-dasharray="4 3"/><text x="738" y="85" font-size="13" font-weight="500" fill="#0c0a09">card JSON</text><text x="738" y="104" font-size="11" fill="#777169">at most 3, capped by the controller</text><line x1="840" y1="122" x2="840" y2="168" stroke="#d6d3d1" stroke-width="1" marker-end="url(#a)"/><rect x="724" y="168" width="232" height="76" rx="10" fill="#fafafa" stroke="#0c0a09" stroke-width="1"/><text x="738" y="193" font-size="13" font-weight="500" fill="#0c0a09">provenance gate</text><text x="738" y="212" font-size="11" fill="#777169">8 card checks · 2 abstention</text><line x1="840" y1="244" x2="840" y2="288" stroke="#d6d3d1" stroke-width="1" marker-end="url(#a)"/><rect x="724" y="288" width="110" height="56" rx="10" fill="#fafafa" stroke="#0c0a09" stroke-width="1"/><text x="738" y="313" font-size="13" font-weight="500" fill="#0c0a09">verified</text><text x="738" y="332" font-size="11" fill="#777169">70</text><rect x="846" y="288" width="110" height="56" rx="10" fill="#fafafa" stroke="#0c0a09" stroke-width="1"/><text x="860" y="313" font-size="13" font-weight="500" fill="#0c0a09">rejected</text><text x="860" y="332" font-size="11" fill="#777169">166</text><text x="24" y="172" font-size="11" fill="#777169">every check the gate makes:</text><text x="24" y="194" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_CIRCULAR_EVIDENCE</text><text x="24" y="212" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_EVIDENCE_NOT_A_MESSAGE</text><text x="24" y="230" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_MSG_OUT_WINDOW</text><text x="24" y="248" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_NO_EVIDENCE</text><text x="24" y="266" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_QUOTE_MISMATCH</text><text x="234" y="194" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_TRIGGER_LATE</text><text x="234" y="212" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_UNKNOWN_MSG</text><text x="234" y="230" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_UNKNOWN_TRIGGER</text><text x="234" y="248" font-size="10.5" fill="#a8a29e" font-family="ui-monospace, monospace">E_NONE_WITH_EVIDENCE</text><text x="234" y="266" font-size="10.5" fill="#a8a29e" font-family="ui-monospace, monospace">E_NONE_WITH_TRIGGER</text><text x="24" y="384" font-size="11" fill="#777169">The model chooses and writes. Everything that can be checked is checked without it — and a card that fails any check is thrown away.</text></svg>