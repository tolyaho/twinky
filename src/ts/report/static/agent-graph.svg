<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 448" width="980" height="448" font-family="Inter, system-ui, sans-serif" role="img" aria-label="How one window becomes a verified or rejected card"><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#d6d3d1"/></marker></defs><rect width="980" height="448" fill="#ffffff"/><rect x="24" y="14" width="14" height="14" rx="3" fill="#fafafa" stroke="#0c0a09"/><text x="46" y="26" font-size="11" fill="#4e4e4e">deterministic — checkable, no model</text><rect x="286" y="14" width="14" height="14" rx="3" fill="none" stroke="#777169" stroke-dasharray="4 3"/><text x="308" y="26" font-size="11" fill="#4e4e4e">the model — two nodes, and only these two</text><text x="956" y="26" font-size="11" fill="#a8a29e" text-anchor="end">every count is measured: 118 recorded runs</text><rect x="24" y="60" width="170" height="62" rx="10" fill="#fafafa" stroke="#0c0a09" stroke-width="1"/><text x="38" y="85" font-size="13" font-weight="500" fill="#0c0a09">sources</text><text x="38" y="104" font-size="10.5" fill="#777169">chat · speech · frames</text><line x1="194" y1="91" x2="238" y2="91" stroke="#d6d3d1" stroke-width="1" marker-end="url(#a)"/><rect x="238" y="60" width="210" height="62" rx="10" fill="#fafafa" stroke="#0c0a09" stroke-width="1"/><text x="252" y="85" font-size="13" font-weight="500" fill="#0c0a09">reduce</text><text x="252" y="104" font-size="10.5" fill="#777169">canonical, counted, ids kept</text><line x1="448" y1="91" x2="492" y2="91" stroke="#d6d3d1" stroke-width="1" marker-end="url(#a)"/><rect x="492" y="48" width="210" height="86" rx="10" fill="none" stroke="#777169" stroke-width="1" stroke-dasharray="4 3"/><text x="506" y="73" font-size="13" font-weight="500" fill="#0c0a09">the model</text><text x="506" y="92" font-size="10.5" fill="#777169">picks tools or answers · t=0</text><line x1="702" y1="91" x2="746" y2="91" stroke="#d6d3d1" stroke-width="1" marker-end="url(#a)"/><line x1="597" y1="134" x2="597" y2="172" stroke="#d6d3d1" stroke-width="1" marker-end="url(#a)"/><text x="605" y="157" font-size="10" fill="#a8a29e">tool call</text><rect x="492" y="178" width="210" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1"/><text x="504" y="195" font-size="11" fill="#4e4e4e">get_chat_window</text><text x="690" y="195" font-size="11" fill="#0c0a09" text-anchor="end">3</text><rect x="492" y="212" width="210" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1"/><text x="504" y="229" font-size="11" fill="#4e4e4e">get_frame_captions</text><text x="690" y="229" font-size="11" fill="#0c0a09" text-anchor="end">2</text><rect x="492" y="246" width="210" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1"/><text x="504" y="263" font-size="11" fill="#4e4e4e">get_transcript_window</text><text x="690" y="263" font-size="11" fill="#0c0a09" text-anchor="end">8</text><rect x="492" y="280" width="210" height="26" rx="6" fill="#ffffff" stroke="#d6d3d1"/><text x="504" y="297" font-size="11" fill="#4e4e4e">group_repeated</text><text x="690" y="297" font-size="11" fill="#0c0a09" text-anchor="end">57</text><text x="492" y="328" font-size="10.5" fill="#777169">4 bounded tools · max 4 calls per step</text><text x="492" y="343" font-size="10.5" fill="#777169">executed and checked by the controller</text><text x="492" y="358" font-size="10" fill="#a8a29e">calls across 59 runs with tools</text><text x="492" y="384" font-size="12" fill="#0c0a09">51 of 59 runs spent 1 of their 4 steps</text><text x="492" y="401" font-size="11" fill="#777169">and the one step was chat</text><rect x="746" y="60" width="210" height="62" rx="10" fill="none" stroke="#777169" stroke-width="1" stroke-dasharray="4 3"/><text x="760" y="85" font-size="13" font-weight="500" fill="#0c0a09">card JSON</text><text x="760" y="104" font-size="10.5" fill="#777169">the answer · at most 3</text><line x1="851" y1="122" x2="851" y2="168" stroke="#d6d3d1" stroke-width="1" marker-end="url(#a)"/><rect x="746" y="168" width="210" height="76" rx="10" fill="#fafafa" stroke="#0c0a09" stroke-width="1"/><text x="760" y="193" font-size="13" font-weight="500" fill="#0c0a09">provenance gate</text><text x="760" y="212" font-size="10.5" fill="#777169">8 card checks · 2 abstention</text><line x1="851" y1="244" x2="851" y2="288" stroke="#d6d3d1" stroke-width="1" marker-end="url(#a)"/><rect x="746" y="288" width="100" height="56" rx="10" fill="#fafafa" stroke="#0c0a09" stroke-width="1"/><text x="760" y="313" font-size="13" font-weight="500" fill="#0c0a09">verified</text><text x="760" y="332" font-size="10.5" fill="#777169">73</text><rect x="856" y="288" width="100" height="56" rx="10" fill="#fafafa" stroke="#0c0a09" stroke-width="1"/><text x="870" y="313" font-size="13" font-weight="500" fill="#0c0a09">rejected</text><text x="870" y="332" font-size="10.5" fill="#777169">163</text><text x="24" y="176" font-size="11" fill="#777169">every check the gate makes:</text><text x="24" y="198" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_CIRCULAR_EVIDENCE</text><text x="24" y="216" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_EVIDENCE_NOT_A_MESSAGE</text><text x="24" y="234" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_MSG_OUT_WINDOW</text><text x="24" y="252" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_NO_EVIDENCE</text><text x="24" y="270" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_QUOTE_MISMATCH</text><text x="234" y="198" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_TRIGGER_LATE</text><text x="234" y="216" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_UNKNOWN_MSG</text><text x="234" y="234" font-size="10.5" fill="#4e4e4e" font-family="ui-monospace, monospace">E_UNKNOWN_TRIGGER</text><text x="234" y="252" font-size="10.5" fill="#a8a29e" font-family="ui-monospace, monospace">E_NONE_WITH_EVIDENCE</text><text x="234" y="270" font-size="10.5" fill="#a8a29e" font-family="ui-monospace, monospace">E_NONE_WITH_TRIGGER</text><text x="24" y="428" font-size="11" fill="#777169">The model chooses and writes. Everything that can be checked is checked without it — and a card that fails any check is thrown away.</text></svg>